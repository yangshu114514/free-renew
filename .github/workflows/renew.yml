name: free-server-renewal

on:
  schedule:
    # 每小时整点（UTC）跑一次。程序幂等：未到期 4 秒退出，只有续费窗口内（~5 天）才真干活。
    # 原来每天 09:30 一班——境外 runner 抖动一次就错过当天；每小时多 24 倍机会，
    # 大幅提高续费窗口内命中成功的概率。未到期 run 不发任何通知，不刷微信/邮件。
    - cron: "0 * * * *" # 每小时整点（UTC）；程序内部判断是否到期，幂等
  workflow_dispatch: # 手动点火（Actions 页面按钮）
    inputs:
      test_screenshot_url:
        description: "可选：只验证截图链路（填一个 CSDN 文章 URL），跳过续期流程"
        required: false
        default: ""
      test_screenshot_title:
        description: "可选：截图验证的文章标题关键词（留空则只防挑战页，不校验标题）"
        required: false
        default: ""
      test_zhihu:
        description: "可选：填账号ID/厂商名只探知乎发文链路(建草稿不发布)；留空走正常续期"
        required: false
        default: ""
      test_platforms:
        description: "可选：填任意值，把已配置的所有发文平台各发一篇草稿体检（全部停在公开发布前，不占发文额度）"
        required: false
        default: ""
      test_write:
        description: "可选：填账号ID/厂商名只生成文章样文输出到日志（不发文不碰平台），验内容质量用"
        required: false
        default: ""
      submit_existing:
        description: "可选：填已发布文章的 URL——复用该文章只重试'截图+提交厂商'，绝不重新发文（治提交阶段网络抖动）"
        required: false
        default: ""
      submit_vendor:
        description: "submit_existing 对应账号：填账号 ID（如 sanfengyun-2）或唯一的厂商名/label"
        required: false
        default: "sanfengyun-1"
      submit_title:
        description: "submit_existing 文章标题关键词（截图校验用，可留空）"
        required: false
        default: ""
      test_notify:
        description: "可选：填任意值只测通知链路（不碰厂商/平台）。注意网关 401/403 会如实报错"
        required: false
        default: ""

# 防止 GitHub 60 天无 activity 自动停用 scheduled workflow：
# 保活由下方自建 keepalive job 完成（每月 1 日按需推空提交，零第三方依赖——
# 原用的 marketplace action 上游已被 GitHub 按 ToS 封禁，见 job 注释）。
# 顶层权限收紧为 read；keepalive job 内部单独提权 write
permissions:
  contents: read

# 串行排队，绝不并行：
# 定时任务每小时触发，而多台服务器同时到期时单轮可能跑很久。没有并发组的话，
# 下一轮会和上一轮重叠——两个进程同时登录同一厂商、同时向同一内容平台发文，
# 既可能重复投稿，也更容易撞风控。排队最多晚一轮，重叠的代价大得多。
concurrency:
  group: free-renew
  cancel-in-progress: false

jobs:
  keepalive:
    # GitHub 会把 60 天无任何仓库活动的 repo 的 scheduled workflow 自动禁用，
    # 且定时运行本身不算"活动"。原先用的第三方 gautamkrishnar/keepalive-workflow
    # 已于 2025-04 被 GitHub 按 ToS 封禁（仓库不存在了），job 在 Set up job 就报
    # "Repository access blocked"——第三方 action 随时可能步后尘，这里自建零依赖版：
    # 每月 1 日若距上次提交已超 30 天，push 一条空提交记录活动。
    # renew.yml 没有 push 触发器，空提交不会造成循环运行。
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Monthly activity ping
        run: |
          if [ "$(date -u +%d)" != "01" ]; then echo "今天不是 1 号，无需 ping"; exit 0; fi
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          if [ "$age" -lt 30 ]; then echo "仓库仍活跃（距上次提交 ${age} 天），跳过"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflow active (monthly ping)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  renew:
    runs-on: ubuntu-latest
    # 超时预算：账号之间**串行**执行，单台最坏 ≈25min（登录 5 轮重试 ≈4min、
    # LLM 3 轮重试 ≈6min、发文+等公开 ≈12min、提交 5 轮重试 ≈5min，均为全打满）。
    # 默认 180min 够 ≈7 台的最坏情况；账号更多时加仓库 Variable RUN_TIMEOUT_MINUTES
    # 覆盖（公式：账号数 × 25 + 30min 余量，GitHub 单 job 硬上限 360）。
    timeout-minutes: ${{ fromJSON(vars.RUN_TIMEOUT_MINUTES || '180') }}
    permissions:
      contents: read
    env:
      # job 级 env：preflight 诊断与 renew 共用同一套 Secrets
      #
      # ── 多账号 ────────────────────────────────────────────────────────
      # 第 1 台用无后缀变量（与旧部署完全一致），第 2 台起用 _N 后缀；
      # 程序按序号逐台续期，事件与截图产物按账号 ID（sanfengyun-1/-2…）区分。
      # 想再加几台，照抄一对 _N 行并改后缀即可（未定义的 Secret 展开为空串，
      # 程序会跳过空槽位，不会报错）。
      #   临时停用某一台：给对应编号加 SANFENGYUN_ENABLED_N=false（Variable）。
      SANFENGYUN_USERNAME: ${{ secrets.SANFENGYUN_USERNAME }}
      SANFENGYUN_PASSWORD: ${{ secrets.SANFENGYUN_PASSWORD }}
      SANFENGYUN_LABEL: ${{ vars.SANFENGYUN_LABEL }}
      SANFENGYUN_USERNAME_2: ${{ secrets.SANFENGYUN_USERNAME_2 }}
      SANFENGYUN_PASSWORD_2: ${{ secrets.SANFENGYUN_PASSWORD_2 }}
      SANFENGYUN_LABEL_2: ${{ vars.SANFENGYUN_LABEL_2 }}
      SANFENGYUN_ENABLED_2: ${{ vars.SANFENGYUN_ENABLED_2 }}
      SANFENGYUN_USERNAME_3: ${{ secrets.SANFENGYUN_USERNAME_3 }}
      SANFENGYUN_PASSWORD_3: ${{ secrets.SANFENGYUN_PASSWORD_3 }}
      SANFENGYUN_LABEL_3: ${{ vars.SANFENGYUN_LABEL_3 }}
      SANFENGYUN_ENABLED_3: ${{ vars.SANFENGYUN_ENABLED_3 }}
      SANFENGYUN_USERNAME_4: ${{ secrets.SANFENGYUN_USERNAME_4 }}
      SANFENGYUN_PASSWORD_4: ${{ secrets.SANFENGYUN_PASSWORD_4 }}
      SANFENGYUN_USERNAME_5: ${{ secrets.SANFENGYUN_USERNAME_5 }}
      SANFENGYUN_PASSWORD_5: ${{ secrets.SANFENGYUN_PASSWORD_5 }}
      SANFENGYUN_USERNAME_6: ${{ secrets.SANFENGYUN_USERNAME_6 }}
      SANFENGYUN_PASSWORD_6: ${{ secrets.SANFENGYUN_PASSWORD_6 }}
      ABEIYUN_USERNAME: ${{ secrets.ABEIYUN_USERNAME }}
      ABEIYUN_PASSWORD: ${{ secrets.ABEIYUN_PASSWORD }}
      ABEIYUN_LABEL: ${{ vars.ABEIYUN_LABEL }}
      ABEIYUN_USERNAME_2: ${{ secrets.ABEIYUN_USERNAME_2 }}
      ABEIYUN_PASSWORD_2: ${{ secrets.ABEIYUN_PASSWORD_2 }}
      ABEIYUN_LABEL_2: ${{ vars.ABEIYUN_LABEL_2 }}
      ABEIYUN_ENABLED_2: ${{ vars.ABEIYUN_ENABLED_2 }}
      ABEIYUN_USERNAME_3: ${{ secrets.ABEIYUN_USERNAME_3 }}
      ABEIYUN_PASSWORD_3: ${{ secrets.ABEIYUN_PASSWORD_3 }}
      ABEIYUN_LABEL_3: ${{ vars.ABEIYUN_LABEL_3 }}
      ABEIYUN_ENABLED_3: ${{ vars.ABEIYUN_ENABLED_3 }}
      ABEIYUN_USERNAME_4: ${{ secrets.ABEIYUN_USERNAME_4 }}
      ABEIYUN_PASSWORD_4: ${{ secrets.ABEIYUN_PASSWORD_4 }}
      ABEIYUN_USERNAME_5: ${{ secrets.ABEIYUN_USERNAME_5 }}
      ABEIYUN_PASSWORD_5: ${{ secrets.ABEIYUN_PASSWORD_5 }}
      ABEIYUN_USERNAME_6: ${{ secrets.ABEIYUN_USERNAME_6 }}
      ABEIYUN_PASSWORD_6: ${{ secrets.ABEIYUN_PASSWORD_6 }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      # 发文平台：默认 csdn；仓库 Settings→Variables 加 PLATFORM_PROVIDER=zhihu 即切知乎
      PLATFORM_PROVIDER: ${{ vars.PLATFORM_PROVIDER || 'csdn' }}
      # 兜底平台：留空=自动（两家 Cookie 都配了就互为备份，主挂切备）；none=关闭
      PLATFORM_FALLBACK: ${{ vars.PLATFORM_FALLBACK }}
      CSDN_COOKIES: ${{ secrets.CSDN_COOKIES }}
      ZHIHU_COOKIES: ${{ secrets.ZHIHU_COOKIES }}
      # 知乎发文话题（可选，空格分隔；留空用内置默认"免费云服务器 虚拟主机"）
      ZHIHU_TOPICS: ${{ vars.ZHIHU_TOPICS }}
      NOTIFY_OPENCLAW_URL: ${{ secrets.NOTIFY_OPENCLAW_URL }}
      NOTIFY_OPENCLAW_USER: ${{ secrets.NOTIFY_OPENCLAW_USER }}
      NOTIFY_OPENCLAW_PASSWORD: ${{ secrets.NOTIFY_OPENCLAW_PASSWORD }}
      # 通知标签（可选，webhook 后端用；留空用内置默认 renewal）
      NOTIFY_TAG: ${{ vars.NOTIFY_TAG }}
      CHROME_PATH: /usr/bin/google-chrome
      FREE_RENEW_DEBUG_DIR: /tmp/freerenew-debug
      FREE_RENEW_LOG_DIR: /tmp/freerenew-logs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2 # 冷构建 ~4min，热构建 ~40s

      # ubuntu runner 只有西文字体，不装 CJK 字体的话 headless Chrome
      # 会把中文全部渲染成豆腐块 □□□（2026-09-12 实测交出过一张全是方块的截图）
      - name: Install CJK fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: Build (release)
        run: cargo build --release --locked

      # 诊断步骤：runner 侧直接实测 LLM 连通性（值被 GitHub 自动打码，长度可读）。
      # 用于定位 401 类问题：区分“Secret 为空/带脏字符”与“厂商侧拒绝”。
      - name: Preflight — LLM connectivity
        run: |
          echo "LLM_BASE_URL = $LLM_BASE_URL"
          echo "LLM_MODEL    = $LLM_MODEL"
          echo "LLM_API_KEY  length = ${#LLM_API_KEY}"
          CODE=$(curl -s -o /tmp/llm.json -w "%{http_code}" -m 60 \
            -X POST "$LLM_BASE_URL/chat/completions" \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"$LLM_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ok\"}],\"max_tokens\":5}")
          echo "LLM HTTP $CODE"
          head -c 300 /tmp/llm.json || true

      - name: Run renewal
        run: |
          # 诊断输入互斥，按此优先级取第一个非空者（与 probe.rs 的分派顺序一致）：
          # submit_existing > test_write > test_zhihu > test_platforms > test_screenshot > test_notify
          if [ -n "$SUBMIT_EXISTING" ]; then
            echo "[submit-existing] 复用已发布文章，只重试截图+提交（不重新发文）: $SUBMIT_EXISTING"
            ./target/release/free-renew --submit-existing "$SUBMIT_VENDOR" "$SUBMIT_EXISTING" "$SUBMIT_TITLE"
          elif [ -n "$TEST_WRITE" ]; then
            echo "[test mode] 只生成样文验内容质量: vendor=$TEST_WRITE"
            ./target/release/free-renew --test-write "$TEST_WRITE"
          elif [ -n "$TEST_ZHIHU" ]; then
            echo "[test mode] 知乎发文链路探路（建草稿不发布）: vendor=$TEST_ZHIHU"
            ./target/release/free-renew --test-zhihu "$TEST_ZHIHU"
          elif [ -n "$TEST_PLATFORMS" ]; then
            echo "[test mode] 发文平台链路体检（各平台发草稿，停在发布前）"
            ./target/release/free-renew --test-platforms
          elif [ -n "$TEST_SCREENSHOT_URL" ]; then
            echo "[test mode] 只验证截图链路: $TEST_SCREENSHOT_URL"
            ./target/release/free-renew --test-screenshot "$TEST_SCREENSHOT_URL" "$TEST_SCREENSHOT_TITLE"
          elif [ -n "$TEST_NOTIFY" ]; then
            echo "[test mode] 只测通知链路（--test-notify，失败时看 notify 相关日志分级）"
            ./target/release/free-renew --test-notify
          else
            ./target/release/free-renew
          fi
        env:
          TEST_SCREENSHOT_URL: ${{ inputs.test_screenshot_url }}
          TEST_SCREENSHOT_TITLE: ${{ inputs.test_screenshot_title }}
          TEST_ZHIHU: ${{ inputs.test_zhihu }}
          TEST_PLATFORMS: ${{ inputs.test_platforms }}
          TEST_WRITE: ${{ inputs.test_write }}
          SUBMIT_EXISTING: ${{ inputs.submit_existing }}
          SUBMIT_VENDOR: ${{ inputs.submit_vendor }}
          SUBMIT_TITLE: ${{ inputs.submit_title }}
          TEST_NOTIFY: ${{ inputs.test_notify }}

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: /tmp/freerenew-logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug artifacts
        # 每轮都传：包含已提交截图的留档（postpone_submitted.png）与页面 HTML，
        # 厂商审核被拒时有原图可对照排查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump
          path: /tmp/freerenew-debug/
          if-no-files-found: ignore
          retention-days: 7
