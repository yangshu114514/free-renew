name: free-server-renewal

on:
  schedule:
    - cron: "30 1 * * *" # 每天 09:30 北京时间；程序内部判断是否到期，幂等
  workflow_dispatch: # 手动点火（Actions 页面按钮）

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2 # 冷构建 ~4min，热构建 ~40s

      - name: Build (release)
        run: cargo build --release --locked

      - name: Run renewal
        env:
          # 云账号（环境变量优先级高于 config.toml）
          SANFENGYUN_USERNAME: ${{ secrets.SANFENGYUN_USERNAME }}
          SANFENGYUN_PASSWORD: ${{ secrets.SANFENGYUN_PASSWORD }}
          ABEIYUN_USERNAME: ${{ secrets.ABEIYUN_USERNAME }}
          ABEIYUN_PASSWORD: ${{ secrets.ABEIYUN_PASSWORD }}
          # LLM（OpenAI 兼容）
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # 发文平台
          PLATFORM_PROVIDER: csdn
          CSDN_COOKIES: ${{ secrets.CSDN_COOKIES }}
          # 失败/成功通知（OpenClaw 后端：网关 agent → 微信）
          NOTIFY_OPENCLAW_URL: ${{ secrets.NOTIFY_OPENCLAW_URL }}
          NOTIFY_OPENCLAW_USER: ${{ secrets.NOTIFY_OPENCLAW_USER }}
          NOTIFY_OPENCLAW_PASSWORD: ${{ secrets.NOTIFY_OPENCLAW_PASSWORD }}
          # headless chrome
          CHROME_PATH: /usr/bin/google-chrome
          # 失败诊断产物目录（artifact 上传用）
          FREE_RENEW_DEBUG_DIR: /tmp/freerenew-debug
          # JSONL 运行日志目录（每次 run 都上传，方便回溯）
          FREE_RENEW_LOG_DIR: /tmp/freerenew-logs
        run: ./target/release/free-renew

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: /tmp/freerenew-logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump
          path: /tmp/freerenew-debug/
          if-no-files-found: ignore
          retention-days: 7
