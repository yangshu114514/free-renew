name: free-server-renewal

on:
  schedule:
    # 每小时第 7 分钟（UTC）跑一次。程序幂等：未到期几秒退出，只有续费窗口内（~5 天）才真干活。
    # 未到期 run 不发任何通知，不刷微信/邮件。
    #
    # 为什么是 :07 而不是 :00——GitHub 官方文档明说 schedule 在高负载时会延迟或跳过，
    # 而"高负载时段包括每个整点的开始"。实测这个仓库写成 "0 * * * *" 时，
    # 一整天只触发了 6 次（期望 24 次），约 25% 命中率。避开整点是最便宜的改善。
    - cron: "7 * * * *" # 每小时第 7 分钟（UTC）；程序内部判断是否到期，幂等
  workflow_dispatch: # 手动点火（Actions 页面按钮）
    inputs:
      test_screenshot_url:
        description: "可选：只验证截图链路（填一个 CSDN 文章 URL），跳过续期流程"
        required: false
        default: ""
      test_screenshot_title:
        description: "可选：截图验证的文章标题关键词（留空则只防挑战页，不校验标题）"
        required: false
        default: ""
      test_zhihu:
        description: "可选：填账号ID/厂商名只探知乎发文链路(建草稿不发布)；留空走正常续期"
        required: false
        default: ""
      test_platforms:
        description: "可选：填任意值，把已配置的所有发文平台各发一篇草稿体检（全部停在公开发布前，不占发文额度）"
        required: false
        default: ""
      test_write:
        description: "可选：填账号ID/厂商名只生成文章样文输出到日志（不发文不碰平台），验内容质量用"
        required: false
        default: ""
      submit_existing:
        description: "可选：填已发布文章的 URL——复用该文章只重试'截图+提交厂商'，绝不重新发文（治提交阶段网络抖动）"
        required: false
        default: ""
      submit_vendor:
        description: "submit_existing 对应账号：填账号 ID（如 sanfengyun-2）或唯一的厂商名/label"
        required: false
        default: "sanfengyun-1"
      submit_title:
        description: "submit_existing 文章标题关键词（截图校验用，可留空）"
        required: false
        default: ""
      test_notify:
        description: "可选：填任意值只测通知链路（不碰厂商/平台）。注意网关 401/403 会如实报错"
        required: false
        default: ""

# 防止 GitHub 60 天无 activity 自动停用 scheduled workflow：
# 保活由下方自建 keepalive job 完成（每月 1 日按需推空提交，零第三方依赖——
# 原用的 marketplace action 上游已被 GitHub 按 ToS 封禁，见 job 注释）。
# 顶层权限收紧为 read；keepalive job 内部单独提权 write
permissions:
  contents: read

# 串行排队，绝不并行：
# 定时任务每小时触发，而多台服务器同时到期时单轮可能跑很久。没有并发组的话，
# 下一轮会和上一轮重叠——两个进程同时登录同一厂商、同时向同一内容平台发文，
# 既可能重复投稿，也更容易撞风控。排队最多晚一轮，重叠的代价大得多。
concurrency:
  group: free-renew
  cancel-in-progress: false

jobs:
  keepalive:
    # GitHub 会把 60 天无任何仓库活动的 repo 的 scheduled workflow 自动禁用，
    # 且定时运行本身不算"活动"。原先用的第三方 gautamkrishnar/keepalive-workflow
    # 已于 2025-04 被 GitHub 按 ToS 封禁（仓库不存在了），job 在 Set up job 就报
    # "Repository access blocked"——第三方 action 随时可能步后尘，这里自建零依赖版：
    # 每月 1 日若距上次提交已超 30 天，push 一条空提交记录活动。
    # renew.yml 没有 push 触发器，空提交不会造成循环运行。
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Monthly activity ping
        run: |
          if [ "$(date -u +%d)" != "01" ]; then echo "今天不是 1 号，无需 ping"; exit 0; fi
          last=$(git log -1 --format=%ct)
          age=$(( ( $(date +%s) - last ) / 86400 ))
          if [ "$age" -lt 30 ]; then echo "仓库仍活跃（距上次提交 ${age} 天），跳过"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflow active (monthly ping)"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  renew:
    runs-on: ubuntu-latest
    # 超时预算：账号之间**串行**执行，单台最坏 ≈25min（登录 5 轮重试 ≈4min、
    # LLM 3 轮重试 ≈6min、发文+等公开 ≈12min、提交 5 轮重试 ≈5min，均为全打满）。
    # 默认 180min 够 ≈7 台的最坏情况；账号更多时加仓库 Variable RUN_TIMEOUT_MINUTES
    # 覆盖（公式：账号数 × 25 + 30min 余量，GitHub 单 job 硬上限 360）。
    timeout-minutes: ${{ fromJSON(vars.RUN_TIMEOUT_MINUTES || '180') }}
    permissions:
      contents: read
    env:
      # job 级 env：preflight 诊断与 renew 共用同一套 Secrets
      #
      # ── 多账号 ────────────────────────────────────────────────────────
      # 第 1 台用无后缀变量（与旧部署完全一致），第 2 台起用 _N 后缀；
      # 程序按序号逐台续期，事件与截图产物按账号 ID（sanfengyun-1/-2…）区分。
      #
      # ⚠️ GitHub Actions 不支持通配符 Secrets：**没在这里声明的编号变量，
      #    程序根本读不到**（配了 Secret 也等于没配）。所以加台数必须同时改这里。
      #    install.ps1 会在向导里按你实际配置的台数自动重写下面这一块；
      #    手动加台时照抄一组四行（USERNAME/PASSWORD/LABEL/ENABLED）并改后缀。
      #
      # >>> CLOUD_ACCOUNTS_BEGIN (由 install.ps1 自动维护，也可手动编辑) >>>
      SANFENGYUN_USERNAME: ${{ secrets.SANFENGYUN_USERNAME }}
      SANFENGYUN_PASSWORD: ${{ secrets.SANFENGYUN_PASSWORD }}
      SANFENGYUN_LABEL: ${{ vars.SANFENGYUN_LABEL }}
      SANFENGYUN_ENABLED: ${{ vars.SANFENGYUN_ENABLED }}
      SANFENGYUN_LOGIN_URL: ${{ vars.SANFENGYUN_LOGIN_URL }}
      SANFENGYUN_RENEW_URL: ${{ vars.SANFENGYUN_RENEW_URL }}
      SANFENGYUN_USERNAME_2: ${{ secrets.SANFENGYUN_USERNAME_2 }}
      SANFENGYUN_PASSWORD_2: ${{ secrets.SANFENGYUN_PASSWORD_2 }}
      SANFENGYUN_LABEL_2: ${{ vars.SANFENGYUN_LABEL_2 }}
      SANFENGYUN_ENABLED_2: ${{ vars.SANFENGYUN_ENABLED_2 }}
      SANFENGYUN_LOGIN_URL_2: ${{ vars.SANFENGYUN_LOGIN_URL_2 }}
      SANFENGYUN_RENEW_URL_2: ${{ vars.SANFENGYUN_RENEW_URL_2 }}
      SANFENGYUN_USERNAME_3: ${{ secrets.SANFENGYUN_USERNAME_3 }}
      SANFENGYUN_PASSWORD_3: ${{ secrets.SANFENGYUN_PASSWORD_3 }}
      SANFENGYUN_LABEL_3: ${{ vars.SANFENGYUN_LABEL_3 }}
      SANFENGYUN_ENABLED_3: ${{ vars.SANFENGYUN_ENABLED_3 }}
      SANFENGYUN_LOGIN_URL_3: ${{ vars.SANFENGYUN_LOGIN_URL_3 }}
      SANFENGYUN_RENEW_URL_3: ${{ vars.SANFENGYUN_RENEW_URL_3 }}
      SANFENGYUN_USERNAME_4: ${{ secrets.SANFENGYUN_USERNAME_4 }}
      SANFENGYUN_PASSWORD_4: ${{ secrets.SANFENGYUN_PASSWORD_4 }}
      SANFENGYUN_LABEL_4: ${{ vars.SANFENGYUN_LABEL_4 }}
      SANFENGYUN_ENABLED_4: ${{ vars.SANFENGYUN_ENABLED_4 }}
      SANFENGYUN_LOGIN_URL_4: ${{ vars.SANFENGYUN_LOGIN_URL_4 }}
      SANFENGYUN_RENEW_URL_4: ${{ vars.SANFENGYUN_RENEW_URL_4 }}
      SANFENGYUN_USERNAME_5: ${{ secrets.SANFENGYUN_USERNAME_5 }}
      SANFENGYUN_PASSWORD_5: ${{ secrets.SANFENGYUN_PASSWORD_5 }}
      SANFENGYUN_LABEL_5: ${{ vars.SANFENGYUN_LABEL_5 }}
      SANFENGYUN_ENABLED_5: ${{ vars.SANFENGYUN_ENABLED_5 }}
      SANFENGYUN_LOGIN_URL_5: ${{ vars.SANFENGYUN_LOGIN_URL_5 }}
      SANFENGYUN_RENEW_URL_5: ${{ vars.SANFENGYUN_RENEW_URL_5 }}
      SANFENGYUN_USERNAME_6: ${{ secrets.SANFENGYUN_USERNAME_6 }}
      SANFENGYUN_PASSWORD_6: ${{ secrets.SANFENGYUN_PASSWORD_6 }}
      SANFENGYUN_LABEL_6: ${{ vars.SANFENGYUN_LABEL_6 }}
      SANFENGYUN_ENABLED_6: ${{ vars.SANFENGYUN_ENABLED_6 }}
      SANFENGYUN_LOGIN_URL_6: ${{ vars.SANFENGYUN_LOGIN_URL_6 }}
      SANFENGYUN_RENEW_URL_6: ${{ vars.SANFENGYUN_RENEW_URL_6 }}
      ABEIYUN_USERNAME: ${{ secrets.ABEIYUN_USERNAME }}
      ABEIYUN_PASSWORD: ${{ secrets.ABEIYUN_PASSWORD }}
      ABEIYUN_LABEL: ${{ vars.ABEIYUN_LABEL }}
      # 免费服务已终止（50685 未开通）：vars 未设置时默认禁用，重新启用需显式 variable set true
      ABEIYUN_ENABLED: ${{ vars.ABEIYUN_ENABLED || 'false' }}
      ABEIYUN_LOGIN_URL: ${{ vars.ABEIYUN_LOGIN_URL }}
      ABEIYUN_RENEW_URL: ${{ vars.ABEIYUN_RENEW_URL }}
      ABEIYUN_USERNAME_2: ${{ secrets.ABEIYUN_USERNAME_2 }}
      ABEIYUN_PASSWORD_2: ${{ secrets.ABEIYUN_PASSWORD_2 }}
      ABEIYUN_LABEL_2: ${{ vars.ABEIYUN_LABEL_2 }}
      ABEIYUN_ENABLED_2: ${{ vars.ABEIYUN_ENABLED_2 }}
      ABEIYUN_LOGIN_URL_2: ${{ vars.ABEIYUN_LOGIN_URL_2 }}
      ABEIYUN_RENEW_URL_2: ${{ vars.ABEIYUN_RENEW_URL_2 }}
      ABEIYUN_USERNAME_3: ${{ secrets.ABEIYUN_USERNAME_3 }}
      ABEIYUN_PASSWORD_3: ${{ secrets.ABEIYUN_PASSWORD_3 }}
      ABEIYUN_LABEL_3: ${{ vars.ABEIYUN_LABEL_3 }}
      ABEIYUN_ENABLED_3: ${{ vars.ABEIYUN_ENABLED_3 }}
      ABEIYUN_LOGIN_URL_3: ${{ vars.ABEIYUN_LOGIN_URL_3 }}
      ABEIYUN_RENEW_URL_3: ${{ vars.ABEIYUN_RENEW_URL_3 }}
      ABEIYUN_USERNAME_4: ${{ secrets.ABEIYUN_USERNAME_4 }}
      ABEIYUN_PASSWORD_4: ${{ secrets.ABEIYUN_PASSWORD_4 }}
      ABEIYUN_LABEL_4: ${{ vars.ABEIYUN_LABEL_4 }}
      ABEIYUN_ENABLED_4: ${{ vars.ABEIYUN_ENABLED_4 }}
      ABEIYUN_LOGIN_URL_4: ${{ vars.ABEIYUN_LOGIN_URL_4 }}
      ABEIYUN_RENEW_URL_4: ${{ vars.ABEIYUN_RENEW_URL_4 }}
      ABEIYUN_USERNAME_5: ${{ secrets.ABEIYUN_USERNAME_5 }}
      ABEIYUN_PASSWORD_5: ${{ secrets.ABEIYUN_PASSWORD_5 }}
      ABEIYUN_LABEL_5: ${{ vars.ABEIYUN_LABEL_5 }}
      ABEIYUN_ENABLED_5: ${{ vars.ABEIYUN_ENABLED_5 }}
      ABEIYUN_LOGIN_URL_5: ${{ vars.ABEIYUN_LOGIN_URL_5 }}
      ABEIYUN_RENEW_URL_5: ${{ vars.ABEIYUN_RENEW_URL_5 }}
      ABEIYUN_USERNAME_6: ${{ secrets.ABEIYUN_USERNAME_6 }}
      ABEIYUN_PASSWORD_6: ${{ secrets.ABEIYUN_PASSWORD_6 }}
      ABEIYUN_LABEL_6: ${{ vars.ABEIYUN_LABEL_6 }}
      ABEIYUN_ENABLED_6: ${{ vars.ABEIYUN_ENABLED_6 }}
      ABEIYUN_LOGIN_URL_6: ${{ vars.ABEIYUN_LOGIN_URL_6 }}
      ABEIYUN_RENEW_URL_6: ${{ vars.ABEIYUN_RENEW_URL_6 }}
      # <<< CLOUD_ACCOUNTS_END <<<
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      # 发文平台：默认 csdn；仓库 Settings→Variables 加 PLATFORM_PROVIDER=zhihu 即切知乎
      PLATFORM_PROVIDER: ${{ vars.PLATFORM_PROVIDER || 'csdn' }}
      # 兜底平台：留空=自动（两家 Cookie 都配了就互为备份，主挂切备）；none=关闭
      PLATFORM_FALLBACK: ${{ vars.PLATFORM_FALLBACK }}
      CSDN_COOKIES: ${{ secrets.CSDN_COOKIES }}
      ZHIHU_COOKIES: ${{ secrets.ZHIHU_COOKIES }}
      # 知乎发文话题（可选，空格分隔；留空用内置默认"免费云服务器 虚拟主机"）
      ZHIHU_TOPICS: ${{ vars.ZHIHU_TOPICS }}
      # ── dev.to（Forem）────────────────────────────────────────────────
      # 平台官方 REST API，认证只要一个 API key（dev.to/settings/extensions 生成）。
      # ⚠️ 必须走 Secret：本仓库是 **公开** 的，key 绝不能写进 config.toml、代码或脚本。
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
      # 文章标签（可选，空格/逗号分隔；留空用内置默认 cloud devops vps servers）
      DEVTO_TAGS: ${{ vars.DEVTO_TAGS }}
      # ── 博客园（配置层已就绪，发布分派尚未接通）──────────────────────
      CNBLOGS_USERNAME: ${{ vars.CNBLOGS_USERNAME }}
      CNBLOGS_TOKEN: ${{ secrets.CNBLOGS_TOKEN }}
      CNBLOGS_BLOG_USER: ${{ vars.CNBLOGS_BLOG_USER }}
      CNBLOGS_TAGS: ${{ vars.CNBLOGS_TAGS }}
      CNBLOGS_CATEGORIES: ${{ vars.CNBLOGS_CATEGORIES }}
      # ── 通知 ──────────────────────────────────────────────────────────
      # 走 SSH 隧道直连服务器 openresty（上方 "Setup SSH tunnel" step 建立；绕开 CF challenge）
      # /tools/invoke = 网关工具直调端点（不经 LLM agent，同步返回 deliveryStatus）
      NOTIFY_OPENCLAW_URL: http://127.0.0.1:18081/tools/invoke
      NOTIFY_OPENCLAW_USER: ${{ secrets.NOTIFY_OPENCLAW_USER }}
      NOTIFY_OPENCLAW_PASSWORD: ${{ secrets.NOTIFY_OPENCLAW_PASSWORD }}
      NOTIFY_OPENCLAW_ENABLED: ${{ secrets.NOTIFY_OPENCLAW_ENABLED || 'true' }}
      # ⚠️ 没有 NOTIFY_OPENCLAW_MODEL：2026-10-03 在三丰云网关实测，/tools/invoke 对
      # 带/不带 model 字段的请求返回**完全相同**的响应（假 target 触发同样的
      # tool_error）——网关静默忽略它。工具直调不经 LLM（见 notify.rs 的说明），
      # 本来就没有模型可选，原透传是死配置，已随 OpenClawNotify.model 一并删除。
      # PushPlus 兜底通道：填 token（Secrets）后，openclaw 未送达时自动改走 pushplus 推微信。
      # GHA 出口 IP 被 Cloudflare 边缘拦 403 时（自建网关走 CF 橙云即此症状），这是可靠兜底；
      # pushplus.plus 是公网直连，不经过 CF。免费层每日 200 条，告警场景绰绰有余。
      NOTIFY_PUSHPLUS_TOKEN: ${{ secrets.NOTIFY_PUSHPLUS_TOKEN }}
      # 通用 webhook 后端（install.ps1 选"通用 Webhook"时会写这个 Secret）。
      # ⚠️ 这一行曾经漏了：Secret 写了、env 没透传，程序根本读不到——
      #    选 webhook 的用户一条通知都收不到，而且全程没有任何报错。
      #    现在有 tests::every_env_var_the_program_reads_is_wired_in_the_workflow 守着。
      NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
      # 微信绑定目标（openclaw message 工具的 target）。走 Secret 而非常量/变量：
      # 这是可关联到个人微信账号的标识符，本仓库公开——值只能存在于加密 Secret 里。
      # 公开仓库的 **Variables 任何人可读**，只有 Secrets 才是加密的。
      NOTIFY_WECHAT_TARGET: ${{ secrets.NOTIFY_WECHAT_TARGET }}
      # 通知标签（可选，webhook 后端用；留空用内置默认 renewal）
      NOTIFY_TAG: ${{ vars.NOTIFY_TAG }}
      # ── 可选调优（留空即用内置默认；都是 Variable，非敏感）────────────
      LLM_TIMEOUT: ${{ vars.LLM_TIMEOUT }}                       # 单次生成超时秒数，默认 120
      # 文章生成总次数（含重写重试）。GHA 没这个值时程序端只有 1 次机会——单次不过
      # 合规校验就放弃整轮，CanRenew 窗口内连续失手会拖到机器回收（2026-09-20 阿贝云
      # 事故）。默认 3；想更激进设仓库 Variable AI_MAX_RETRIES 覆盖。
      AI_MAX_RETRIES: ${{ vars.AI_MAX_RETRIES || '3' }}
      ARTICLE_READY_TIMEOUT: ${{ vars.ARTICLE_READY_TIMEOUT }}   # 裸 HTTP 就绪探测，默认 60
      ARTICLE_VISIBLE_TIMEOUT: ${{ vars.ARTICLE_VISIBLE_TIMEOUT }} # 等文章公开上限，默认 720
      HTTP_TIMEOUT: ${{ vars.HTTP_TIMEOUT }}                     # 厂商小请求超时，默认 30
      CHROME_PATH: /usr/bin/google-chrome
      FREE_RENEW_DEBUG_DIR: /tmp/freerenew-debug
      FREE_RENEW_LOG_DIR: /tmp/freerenew-logs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2 # 冷构建 ~4min，热构建 ~40s

      # ubuntu runner 只有西文字体，不装 CJK 字体的话 headless Chrome
      # 会把中文全部渲染成豆腐块 □□□（2026-09-12 实测交出过一张全是方块的截图）
      #
      # 为什么不是一句 `apt-get update && apt-get install`：
      # 2026-10-03 实测该写法在本 runner 上**静默挂死 26 分钟**（apt 默认不设连接
      # 超时，镜像不可达就一直等），而本 job 的 timeout 是 180min——一个坏镜像就
      # 能把当次续期拖到超时；更糟的是 concurrency 是 cancel-in-progress:false，
      # 僵死的 run 会把后续整点调度一起堵住。所以这里显式设超时 + 3 轮重试 +
      # 强制 IPv4（IPv6 黑洞是 apt 卡死的常见成因），把"挂死"变成"快速失败"。
      # 已装中文字体则直接跳过，省掉整段网络往返（自建/缓存镜像上常见）。
      #
      # 失败即 exit 1 而不是 continue-on-error：字体缺失只会产出豆腐块截图，
      # 而截图发生在**发文之后**——硬跑下去等于先烧掉一篇发文额度、再交一张
      # 必被审核打回的证据。宁可在发文前就把这一轮判失败。
      - name: Install CJK fonts
        timeout-minutes: 8
        run: |
          set -euo pipefail
          if fc-list :lang=zh 2>/dev/null | grep -q .; then
            echo "系统已有中文字体，跳过安装"
            fc-list :lang=zh | head -5
            exit 0
          fi
          APT_OPTS=(-o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
                    -o Acquire::Retries=3 -o Acquire::ForceIPv4=true)
          for i in 1 2 3; do
            echo "───── apt 第 $i 次尝试 ─────"
            if sudo apt-get "${APT_OPTS[@]}" update -qq &&
               sudo apt-get "${APT_OPTS[@]}" install -y -qq fonts-noto-cjk; then
              echo "中文字体安装成功"
              exit 0
            fi
            echo "::warning::第 $i 次 apt 失败，5s 后重试"
            sleep 5
          done
          echo "::error::三次尝试后中文字体仍装不上——截图会渲染成豆腐块，本 run 判失败（不交一张全是方块的证据）"
          exit 1

      - name: Build (release)
        run: cargo build --release --locked

      # SSH 隧道直连服务器 openresty（绕开 Cloudflare 对数据中心 IP 的 Bot Fight Mode challenge）。
      # 结构：本地 18081 → 服务器回环上的 openresty（catch-all server_name 配置）→ 网关。
      # openresty 上挂 nginx basic auth，凭据在 Secret 里；无 XFF 时给虚拟终态客户端归因，
      # 网关侧才认这次调用（kb-mcp 同款机制）。
      # ⚠️ 主机地址与 SSH 端口**不写进本文件**：这是公开仓库，具体 IP/端口会让
      #    暴力破解与横向探测的成本大幅下降，因此从 secrets 注入（与私钥同级）。
      - name: Setup SSH tunnel (notify bypass CF)
        continue-on-error: true
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          NOTIFY_SSH_HOST: ${{ secrets.NOTIFY_SSH_HOST }}
          NOTIFY_SSH_PORT: ${{ secrets.NOTIFY_SSH_PORT }}
        run: |
          if [ -z "$NOTIFY_SSH_HOST" ]; then
            echo "::warning name=tunnel skipped::NOTIFY_SSH_HOST 未配置——跳过隧道建立；openclaw 通知将失败并降级到 pushplus"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_sf
          chmod 600 ~/.ssh/id_sf
          ssh -f -N -L 18081:127.0.0.1:8081 \
            -i ~/.ssh/id_sf -p "${NOTIFY_SSH_PORT:-22}" \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ExitOnForwardFailure=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            "root@${NOTIFY_SSH_HOST}"
          echo "tunnel ready -> 127.0.0.1:18081"

      # 诊断步骤：runner 侧直接实测 LLM 连通性（值被 GitHub 自动打码，长度可读）。
      # 用于定位 401 类问题：区分“Secret 为空/带脏字符”与“厂商侧拒绝”。
      - name: Preflight — LLM connectivity
        run: |
          echo "LLM_BASE_URL = $LLM_BASE_URL"
          echo "LLM_MODEL    = $LLM_MODEL"
          echo "LLM_API_KEY  length = ${#LLM_API_KEY}"
          CODE=$(curl -s -o /tmp/llm.json -w "%{http_code}" -m 60 \
            -X POST "$LLM_BASE_URL/chat/completions" \
            -H "Authorization: Bearer $LLM_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"$LLM_MODEL\",\"messages\":[{\"role\":\"user\",\"content\":\"ok\"}],\"max_tokens\":5}")
          echo "LLM HTTP $CODE"
          head -c 300 /tmp/llm.json || true

      - name: Run renewal
        run: |
          # 诊断输入互斥，按此优先级取第一个非空者（与 probe.rs 的分派顺序一致）：
          # submit_existing > test_write > test_zhihu > test_platforms > test_screenshot > test_notify
          if [ -n "$SUBMIT_EXISTING" ]; then
            echo "[submit-existing] 复用已发布文章，只重试截图+提交（不重新发文）: $SUBMIT_EXISTING"
            ./target/release/free-renew --submit-existing "$SUBMIT_VENDOR" "$SUBMIT_EXISTING" "$SUBMIT_TITLE"
          elif [ -n "$TEST_WRITE" ]; then
            echo "[test mode] 只生成样文验内容质量: vendor=$TEST_WRITE"
            ./target/release/free-renew --test-write "$TEST_WRITE"
          elif [ -n "$TEST_ZHIHU" ]; then
            echo "[test mode] 知乎发文链路探路（建草稿不发布）: vendor=$TEST_ZHIHU"
            ./target/release/free-renew --test-zhihu "$TEST_ZHIHU"
          elif [ -n "$TEST_PLATFORMS" ]; then
            echo "[test mode] 发文平台链路体检（各平台发草稿，停在发布前）"
            ./target/release/free-renew --test-platforms
          elif [ -n "$TEST_SCREENSHOT_URL" ]; then
            echo "[test mode] 只验证截图链路: $TEST_SCREENSHOT_URL"
            ./target/release/free-renew --test-screenshot "$TEST_SCREENSHOT_URL" "$TEST_SCREENSHOT_TITLE"
          elif [ -n "$TEST_NOTIFY" ]; then
            echo "[test mode] 只测通知链路（--test-notify，失败时看 notify 相关日志分级）"
            ./target/release/free-renew --test-notify
          else
            ./target/release/free-renew
          fi
        env:
          TEST_SCREENSHOT_URL: ${{ inputs.test_screenshot_url }}
          TEST_SCREENSHOT_TITLE: ${{ inputs.test_screenshot_title }}
          TEST_ZHIHU: ${{ inputs.test_zhihu }}
          TEST_PLATFORMS: ${{ inputs.test_platforms }}
          TEST_WRITE: ${{ inputs.test_write }}
          SUBMIT_EXISTING: ${{ inputs.submit_existing }}
          SUBMIT_VENDOR: ${{ inputs.submit_vendor }}
          SUBMIT_TITLE: ${{ inputs.submit_title }}
          TEST_NOTIFY: ${{ inputs.test_notify }}

      - name: Upload run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs
          path: /tmp/freerenew-logs/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug artifacts
        # 每轮都传：包含已提交截图的留档（postpone_submitted.png）与页面 HTML，
        # 厂商审核被拒时有原图可对照排查
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-dump
          path: /tmp/freerenew-debug/
          if-no-files-found: ignore
          retention-days: 7
