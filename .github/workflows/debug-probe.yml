name: debug-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 被探测的真实文章 URL 从 Secret 读：这是公开仓库，写死
      # blog.csdn.net/<账号>/... 等于把你的 CSDN 账号 ID 白送给扫描器。
      # fork 出去的副本没有这两个 Secret，对应探针会自己跳过（而不是失败）。
      CSDN_ARTICLE: ${{ secrets.CSDN_PROBE_ARTICLE }}
      CSDN_ARTICLE_2: ${{ secrets.CSDN_PROBE_ARTICLE_2 }}
    steps:
      # 需要 checkout 才能 source 判据库（.github/scripts/probe-lib.sh）。
      # 该库给出每类探针"什么才算符合预期"的判据——没有判据的探针会制造假通过，
      # 见库文件头的说明。
      - uses: actions/checkout@v4

      # 放在第一位：前面的 CSDN/厂商探针都可能失败（curl SSL、WAF、网络抖动），
      # 而 GitHub Actions 默认在某步骤失败后**跳过后续步骤**——上一版就因此让
      # 这个 dev.to 检查显示 "-" 被跳过、完全没跑到。放最前面才保证它一定执行。
      - name: dev.to API key check (READ-ONLY, creates no draft)
        if: always()
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          # 只读 GET /api/users/me：验证 key 是否有效、是否被正确注入。
          # **刻意不用 test_platforms**——那会为每个平台建一篇草稿，而 dev.to 的
          # 公开 API 没有删除文章的端点（只有 publish/update/unpublish），
          # 草稿只能去网页端手删。这里零副作用地把链路验完。
          if [ -z "$DEVTO_API_KEY" ]; then
            echo "::notice name=devto skipped::Secret DEVTO_API_KEY 未配置"
            exit 0
          fi
          code=$(curl -sS -o /tmp/devto-me.json -w "%{http_code}" -m 30 \
            -H "api-key: $DEVTO_API_KEY" -H "accept: application/json" \
            https://dev.to/api/users/me || echo "000")
          echo "GET /api/users/me -> HTTP $code"
          # 只回显 username 与 key 长度；**绝不回显 key 本身**
          echo "key length = ${#DEVTO_API_KEY}"
          if [ "$code" = "200" ]; then
            echo "authenticated as: $(python3 -c 'import json,sys;print(json.load(open("/tmp/devto-me.json")).get("username"))' 2>/dev/null || echo '?')"
            echo "✅ dev.to 发文链路的认证侧可用"
          else
            echo "❌ HTTP $code"
            head -c 300 /tmp/devto-me.json; echo ""
            exit 1
          fi

      # 可达性探针：拿到任何 HTTP 码都算"可达"，只有 000（连不上）才算失败。
      # 这条正好覆盖"厂商连不上导致整轮续期报废"的故障模式（2026-10-03 实测：
      # 17 次定时续期里 7 次挂在 api.sanfengyun.com 连接超时，而当时本步无判据、
      # 照样报 success）。
      - name: vendor API reachability (sanfengyun IP-ban check)
        if: always()
        run: |
          source .github/scripts/probe-lib.sh
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          for u in "https://api.sanfengyun.com/www/login.php" \
                   "http://api.sanfengyun.com/www/login.php" \
                   "https://api.abeiyun.com/www/login.php"; do
            # ⚠️ 不要写 `|| echo "000"`：curl 失败时自己已经用 -w 输出了 000，
            # 再补一个会拼成 "000000"，判据就不认了（第一版正是这么假通过的）。
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 20 -A "$UA" "$u" 2>/dev/null) || true
            classify_reachable "$code" "$u" || exit 1
          done
          echo "✅ 三台厂商端点均可达（注：续期走的是同一批域名，000 才是真故障）"

      # CSDN 这几步是**负向对照**（negative control）：CSDN 对无 cookie 的裸请求固定下发
      # WAF 521 JS 挑战，所以"被挡住"才是预期结果。判据不是"必须 200"，而是"必须能被
      # 明确归类"——无法归类（000/空体/未知码）说明探针自身失效，必须失败。
      - name: csdn plain-HTTP probe（负向对照：预期被 WAF 挡）
        if: always()
        run: |
          source .github/scripts/probe-lib.sh
          if [ -z "$CSDN_ARTICLE" ]; then echo "::notice::跳过：Secret CSDN_PROBE_ARTICLE 未配置"; exit 0; fi
          code=$(curl -s -o /tmp/a.html -w "%{http_code}" -m 20 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "$CSDN_ARTICLE" 2>/dev/null) || true
          head -c 200 /tmp/a.html; echo ""
          classify_csdn "$code" /tmp/a.html "csdn plain-HTTP" || exit 1

      - name: csdn WAP-share URL probe（负向对照：curl + chrome 三路各自归类）
        if: always()
        run: |
          source .github/scripts/probe-lib.sh
          if [ -z "$CSDN_ARTICLE" ]; then echo "::notice::跳过：Secret CSDN_PROBE_ARTICLE 未配置"; exit 0; fi
          WAP="${CSDN_ARTICLE}?utm_source=blog_wap_share"
          MOBILE_UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
          fail=0
          code=$(curl -s -o /tmp/w1.html -w "%{http_code}" -m 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" "$WAP" 2>/dev/null) || true
          classify_csdn "$code" /tmp/w1.html "WAP + curl desktop UA" || fail=1
          code=$(curl -s -o /tmp/w2.html -w "%{http_code}" -m 20 -A "$MOBILE_UA" "$WAP" 2>/dev/null) || true
          classify_csdn "$code" /tmp/w2.html "WAP + curl mobile UA" || fail=1
          google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom --virtual-time-budget=10000 \
            --window-size=390,844 "$WAP" > /tmp/w3.html 2>/dev/null || true
          # chrome --dump-dom 拿不到 HTTP 码，传 "200" 占位；classify 靠**内容特征**
          # 归类（371 字节的 "403 Forbidden" 错误页也在"被挡"特征集里）
          classify_csdn "200" /tmp/w3.html "WAP + headless chrome" || fail=1
          [ "$fail" = "0" ] || exit 1

      - name: headless chrome probe — default headless（负向对照）
        if: always()
        run: |
          source .github/scripts/probe-lib.sh
          if [ -z "$CSDN_ARTICLE" ]; then echo "::notice::跳过：Secret CSDN_PROBE_ARTICLE 未配置"; exit 0; fi
          google-chrome --headless --no-sandbox --disable-gpu --dump-dom --virtual-time-budget=10000 \
            "$CSDN_ARTICLE" > /tmp/dom1.html 2>/tmp/e1.log || true
          classify_csdn "200" /tmp/dom1.html "chrome --headless" || exit 1

      - name: headless chrome probe — new headless mode（负向对照）
        if: always()
        run: |
          source .github/scripts/probe-lib.sh
          if [ -z "$CSDN_ARTICLE" ]; then echo "::notice::跳过：Secret CSDN_PROBE_ARTICLE 未配置"; exit 0; fi
          google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom --virtual-time-budget=10000 \
            "$CSDN_ARTICLE" > /tmp/dom2.html 2>/tmp/e2.log || true
          classify_csdn "200" /tmp/dom2.html "chrome --headless=new" || exit 1

      # 可达性探针：每站必须拿到**某个** HTTP 码才算可达（403 也算——那说明网络通、
      # 只是站点拒绝）；只有 000 才失败。原版把状态码打印出来却无任何判据，
      # 网络整体不通时照样报 success。
      - name: candidate platforms reachability from Azure runner
        if: always()
        run: |
          source .github/scripts/probe-lib.sh
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          fail=0
          probe() { # $1=label $2=url
            local code
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 15 -A "$UA" "$2" 2>/dev/null) || true
            classify_reachable "$code" "$1" || fail=1
          }
          probe "V2EX www"        "https://www.v2ex.com/"
          probe "V2EX api"        "https://www.v2ex.com/api/topics/hot.json"
          probe "51CTO 文章页"     "https://blog.51cto.com/u_16213340/13240688"
          probe "segmentfault 文章页" "https://segmentfault.com/a/1190000041516850"
          probe "知乎专栏（基线：预期 403，但可达）" "https://zhuanlan.zhihu.com/p/2080768725272245516"
          probe "今日头条"         "https://www.toutiao.com/article/7400000000000000000/"
          [ "$fail" = "0" ] || exit 1
          echo "✅ 所有候选平台从 Azure runner 均可达（各站 4xx/5xx 属站点策略，不算失败）"

  sshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Run --test-screenshot (cookie-injected, live article)
        env:
          CSDN_COOKIES: ${{ secrets.CSDN_COOKIES }}
          CSDN_ARTICLE_2: ${{ secrets.CSDN_PROBE_ARTICLE_2 }}
          CHROME_PATH: /usr/bin/google-chrome
          FREE_RENEW_DEBUG_DIR: /tmp/sshot-debug
        run: |
          if [ -z "$CSDN_ARTICLE_2" ]; then
            echo "::notice name=sshot skipped::Secret CSDN_PROBE_ARTICLE_2 未配置——跳过截图探针"
            exit 0
          fi
          ./target/release/free-renew --test-screenshot "$CSDN_ARTICLE_2"
      - name: upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshot
          path: /tmp/sshot-debug/
          if-no-files-found: ignore
