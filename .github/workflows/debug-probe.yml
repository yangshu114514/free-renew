name: debug-probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 被探测的真实文章 URL 从 Secret 读：这是公开仓库，写死
      # blog.csdn.net/<账号>/... 等于把你的 CSDN 账号 ID 白送给扫描器。
      # fork 出去的副本没有这两个 Secret，对应探针会自己跳过（而不是失败）。
      CSDN_ARTICLE: ${{ secrets.CSDN_PROBE_ARTICLE }}
      CSDN_ARTICLE_2: ${{ secrets.CSDN_PROBE_ARTICLE_2 }}
    steps:
      - name: vendor API reachability (sanfengyun IP-ban check)
        run: |
          echo "--- sanfengyun https ---"
          curl -s -o /dev/null -w "%{http_code} (%{time_total}s)" -m 20 https://api.sanfengyun.com/www/login.php || echo " FAIL"
          echo ""
          echo "--- sanfengyun http ---"
          curl -s -o /dev/null -w "%{http_code} (%{time_total}s)" -m 20 http://api.sanfengyun.com/www/login.php || echo " FAIL"
          echo ""
          echo "--- abeiyun https ---"
          curl -s -o /dev/null -w "%{http_code} (%{time_total}s)" -m 20 https://api.abeiyun.com/www/login.php || echo " FAIL"
          echo ""

      - name: csdn plain-HTTP probe (today's live article)
        run: |
          if [ -z "$CSDN_ARTICLE" ]; then echo "跳过：Secret CSDN_PROBE_ARTICLE 未配置"; exit 0; fi
          curl -s -o /tmp/a.html -w "HTTP:%{http_code} size:%{size_download}" -m 20 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "$CSDN_ARTICLE"
          echo ""
          head -c 200 /tmp/a.html

      - name: csdn WAP-share URL probe (curl + chrome)
        run: |
          if [ -z "$CSDN_ARTICLE" ]; then echo "跳过：Secret CSDN_PROBE_ARTICLE 未配置"; exit 0; fi
          WAP="${CSDN_ARTICLE}?utm_source=blog_wap_share"
          MOBILE_UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"
          echo "--- curl desktop UA ---"
          curl -s -o /tmp/w1.html -w "HTTP:%{http_code} size:%{size_download}" -m 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0" "$WAP"
          echo ""
          echo "--- curl mobile UA ---"
          curl -s -o /tmp/w2.html -w "HTTP:%{http_code} size:%{size_download}" -m 20 -A "$MOBILE_UA" "$WAP"
          echo ""
          echo "--- chrome headless=new on wap URL ---"
          google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom --virtual-time-budget=10000 \
            --window-size=390,844 "$WAP" > /tmp/w3.html 2>/dev/null || true
          echo "DOM size: $(wc -c < /tmp/w3.html)"
          grep -o "iw(\|403 Forbidden\|article_title\|article_content\|阿贝" /tmp/w3.html /tmp/w1.html /tmp/w2.html 2>/dev/null | sort | uniq -c || echo "(no markers)"

      - name: headless chrome probe — default headless
        run: |
          if [ -z "$CSDN_ARTICLE" ]; then echo "跳过：Secret CSDN_PROBE_ARTICLE 未配置"; exit 0; fi
          google-chrome --headless --no-sandbox --disable-gpu --dump-dom --virtual-time-budget=10000 \
            "$CSDN_ARTICLE" > /tmp/dom1.html 2>/tmp/e1.log || true
          echo "DOM size: $(wc -c < /tmp/dom1.html)"
          grep -o "iw(\|403 Forbidden\|article_title\|WAF" /tmp/dom1.html | sort | uniq -c || echo "(no signature)"

      - name: headless chrome probe — new headless mode
        run: |
          if [ -z "$CSDN_ARTICLE" ]; then echo "跳过：Secret CSDN_PROBE_ARTICLE 未配置"; exit 0; fi
          google-chrome --headless=new --no-sandbox --disable-gpu --dump-dom --virtual-time-budget=10000 \
            "$CSDN_ARTICLE" > /tmp/dom2.html 2>/tmp/e2.log || true
          echo "DOM size: $(wc -c < /tmp/dom2.html)"
          grep -o "iw(\|403 Forbidden\|article_title\|WAF" /tmp/dom2.html | sort | uniq -c || echo "(no signature)"

      - name: dev.to API key check (READ-ONLY, creates no draft)
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          # 只读 GET /api/users/me：验证 key 是否有效、是否被正确注入。
          # **刻意不用 test_platforms**——那会为每个平台建一篇草稿，而 dev.to 的
          # 公开 API 没有删除文章的端点（只有 publish/update/unpublish），
          # 草稿只能去网页端手删。这里零副作用地把链路验完。
          if [ -z "$DEVTO_API_KEY" ]; then
            echo "::notice name=devto skipped::Secret DEVTO_API_KEY 未配置"
            exit 0
          fi
          code=$(curl -sS -o /tmp/devto-me.json -w "%{http_code}" -m 30 \
            -H "api-key: $DEVTO_API_KEY" -H "accept: application/json" \
            https://dev.to/api/users/me || echo "000")
          echo "GET /api/users/me -> HTTP $code"
          # 只回显 username 与 key 长度；**绝不回显 key 本身**
          echo "key length = ${#DEVTO_API_KEY}"
          if [ "$code" = "200" ]; then
            echo "authenticated as: $(python3 -c 'import json,sys;print(json.load(open("/tmp/devto-me.json")).get("username"))' 2>/dev/null || echo '?')"
            echo "✅ dev.to 发文链路的认证侧可用"
          else
            echo "❌ HTTP $code"
            head -c 300 /tmp/devto-me.json; echo ""
            exit 1
          fi

      - name: candidate platforms reachability from Azure runner
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          echo "--- V2EX (approved list + official API) ---"
          curl -s -o /dev/null -w "www:%{http_code} " -m 15 -A "$UA" https://www.v2ex.com/
          curl -s -o /dev/null -w "api:%{http_code}" -m 15 https://www.v2ex.com/api/topics/hot.json
          echo ""
          echo "--- 51CTO blog article page ---"
          curl -s -o /tmp/51.html -w "%{http_code} size:%{size_download}" -m 15 -A "$UA" https://blog.51cto.com/u_16213340/13240688
          echo ""
          echo "--- segmentfault article page ---"
          curl -s -o /tmp/sf.html -w "%{http_code} size:%{size_download}" -m 15 -A "$UA" https://segmentfault.com/a/1190000041516850
          echo ""
          echo "--- zhihu article page (baseline, expect 403) ---"
          curl -s -o /dev/null -w "%{http_code}" -m 15 -A "$UA" https://zhuanlan.zhihu.com/p/2080768725272245516
          echo ""
          echo "--- toutiao ---"
          curl -s -o /dev/null -w "%{http_code}" -m 15 -A "$UA" https://www.toutiao.com/article/7400000000000000000/
          echo ""

  sshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release
      - name: Run --test-screenshot (cookie-injected, live article)
        env:
          CSDN_COOKIES: ${{ secrets.CSDN_COOKIES }}
          CSDN_ARTICLE_2: ${{ secrets.CSDN_PROBE_ARTICLE_2 }}
          CHROME_PATH: /usr/bin/google-chrome
          FREE_RENEW_DEBUG_DIR: /tmp/sshot-debug
        run: |
          if [ -z "$CSDN_ARTICLE_2" ]; then
            echo "::notice name=sshot skipped::Secret CSDN_PROBE_ARTICLE_2 未配置——跳过截图探针"
            exit 0
          fi
          ./target/release/free-renew --test-screenshot "$CSDN_ARTICLE_2"
      - name: upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshot
          path: /tmp/sshot-debug/
          if-no-files-found: ignore
